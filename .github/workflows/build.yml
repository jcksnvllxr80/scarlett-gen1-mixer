name: Build

# Every push to main/master: test, build and package (the .dmg is kept as an artifact).
# A GitHub Release is created only when the version in Version.xcconfig has no release yet.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write   # to create tags and releases

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for the build number

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Read version
        id: version
        run: echo "version=$(scripts/version.sh)" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: |
          xcodebuild test \
            -project ScarlettGen1Mixer/ScarlettGen1Mixer.xcodeproj \
            -scheme ScarlettKit \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM=

      - name: Build and package
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/package.sh

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: ScarlettGen1Mixer-${{ steps.version.outputs.version }}
          path: build/ScarlettGen1Mixer.dmg

      - name: Release if the version is new
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to release."
            exit 0
          fi
          cp build/ScarlettGen1Mixer.dmg "build/ScarlettGen1Mixer-$VERSION.dmg"
          # Release description: this version's section of RELEASE_NOTES.md
          awk -v v="## $VERSION" '$0 == v {on=1; next} /^## / {on=0} on' RELEASE_NOTES.md > build/notes.md
          gh release create "$TAG" "build/ScarlettGen1Mixer-$VERSION.dmg" \
            --target "$GITHUB_SHA" --title "Scarlett Gen 1 Mixer $VERSION" --notes-file build/notes.md
