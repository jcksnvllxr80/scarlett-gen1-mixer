name: Build

# Runs only when source changes AND the version in ScarlettGen1Mixer/Version.xcconfig was bumped:
# a quick gate checks the version; without a bump nothing is built. With a bump it tests, builds
# and packages; on main it also releases that version.
on:
  push:
    paths:
      - "ScarlettGen1Mixer/**"
      - "scripts/**"
      - "packaging/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "ScarlettGen1Mixer/**"
      - "scripts/**"
      - "packaging/**"
      - ".github/workflows/**"

permissions:
  contents: write   # to create tags and releases

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      bumped: ${{ steps.check.outputs.bumped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Was the version bumped?
        id: check
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          # Compare with the PR's base, the previous commit on this branch, or (new branch) main
          BASE="${PR_BASE:-$BEFORE}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git merge-base origin/main HEAD)"
          fi
          version() { git show "$1:ScarlettGen1Mixer/Version.xcconfig" 2>/dev/null | awk -F= '/^[[:space:]]*MARKETING_VERSION/ {gsub(/[[:space:]]/, "", $2); print $2}'; }
          OLD="$(version "$BASE")"; NEW="$(version HEAD)"
          if [ "$OLD" != "$NEW" ]; then
            echo "Version bumped: $OLD -> $NEW"
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Version not bumped::Still $NEW, so nothing is built. Bump ScarlettGen1Mixer/Version.xcconfig to build and release."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.bumped == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for the build number

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Read version
        id: version
        run: echo "version=$(scripts/version.sh)" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: |
          xcodebuild test \
            -project ScarlettGen1Mixer/ScarlettGen1Mixer.xcodeproj \
            -scheme ScarlettKit \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM=

      - name: Build and package
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/package.sh

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: ScarlettGen1Mixer-${{ steps.version.outputs.version }}
          path: build/ScarlettGen1Mixer.dmg

      - name: Release if the version is new
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice title=No release::$TAG already exists. Bump ScarlettGen1Mixer/Version.xcconfig to release."
            exit 0
          fi
          cp build/ScarlettGen1Mixer.dmg "build/ScarlettGen1Mixer-$VERSION.dmg"
          ASSETS=("build/ScarlettGen1Mixer-$VERSION.dmg")
          # Sparkle update: the signed zip and the update feed (needs the SPARKLE_PRIVATE_KEY secret)
          if [ -n "$SPARKLE_PRIVATE_KEY" ]; then
            KEY="$RUNNER_TEMP/sparkle.key"
            (umask 077; printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY")
            scripts/make-appcast.sh "$KEY"
            rm -f "$KEY"
            cp build/ScarlettGen1Mixer.zip "build/ScarlettGen1Mixer-$VERSION.zip"
            ASSETS+=("build/ScarlettGen1Mixer-$VERSION.zip" build/appcast.xml)
          else
            echo "No SPARKLE_PRIVATE_KEY secret: releasing without an update feed."
          fi
          # Release description: this version's section of RELEASE_NOTES.md
          awk -v v="## $VERSION" '$0 == v {on=1; next} /^## / {on=0} on' RELEASE_NOTES.md > build/notes.md
          gh release create "$TAG" "${ASSETS[@]}" \
            --target "$GITHUB_SHA" --title "Scarlett Gen 1 Mixer $VERSION" --notes-file build/notes.md
